<!-- templates/users/profile.html -->
{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Профиль" %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h1 class="card-title text-center mb-4">{% trans "Профиль" %}</h1>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid gap-2 mt-3">
                        <button class="btn btn-primary" type="submit">{% trans "Сохранить" %}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
